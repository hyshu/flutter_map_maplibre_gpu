name: flutter_map_maplibre_gpu
description: >-
  MapLibre vector maps for flutter_map, with markers and routes that stay in sync
  with the map. Rendered with Flutter GPU.
version: 0.0.1
repository: https://github.com/hyshu/flutter_map_maplibre_gpu
homepage: https://github.com/hyshu/flutter_map_maplibre_gpu
issue_tracker: https://github.com/hyshu/flutter_map_maplibre_gpu/issues
topics:
  - flutter-map
  - maplibre
  - mvt

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  maplibre_flutter_gpu: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

platforms:
  android:
  ios:
  macos:
  linux:
  windows:
