name: flutter_map_current_location_example
description: A minimal current-location map using Flutter Map and Geolocator.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_maplibre_gpu:
    path: ../..
  geolocator: ^14.1.1
  latlong2: ^0.9.1
  maplibre_flutter_gpu: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
