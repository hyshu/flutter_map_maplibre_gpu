name: flutter_map_maplibre_gpu_example
description: A world vector map with Flutter Map city markers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_maplibre_gpu:
    path: ..
  latlong2: ^0.9.1
  maplibre_flutter_gpu: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
